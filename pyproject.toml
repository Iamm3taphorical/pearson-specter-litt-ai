[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pearson-specter-litt-ai"
version = "0.1.0"
description = "Grounded legal document processing, retrieval, drafting, and feedback learning workflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mahir Dyan" }]
dependencies = []

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23", "Pillow>=10"]
ocr = ["pytesseract>=0.3.10"]
semantic = ["sentence-transformers>=2.6"]
api = []
dev = ["pytest>=8"]

[project.scripts]
psl-workflow = "legal_ai_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
